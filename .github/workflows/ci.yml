name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: npm ci
      - run: npm run doctor
      - run: npm run manifest
      - run: npm test
      - run: npm run smoke
      - run: python -m unittest discover -s tests/packaging -p "test_*.py"

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's public macos-14 image is arm64; assert that below rather
          # than accidentally accepting an Intel host when runner labels change.
          - os: macos-14
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e "if(process.platform+'-'+process.arch!==process.env.EXPECTED_TARGET)process.exit(1)"
      - run: npm ci
      - name: Build arm64 worker and libusb, run offline CTest
        if: matrix.target == 'darwin-arm64'
        run: python scripts/build-native.py
      - name: Assemble pinned Windows Python
        if: matrix.target == 'win32-x64'
        run: python scripts/assemble-runtime.py
      - name: Run integration tests with the assembled target runtime
        run: npm test
      - name: Exercise actual target worker in mock mode
        run: node scripts/check-package.mjs .
      - name: Preserve native modes in artifact transport
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: tar -cf "build/runtime-$TARGET.tar" -C runtime "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: build/runtime-${{ matrix.target }}.tar
          if-no-files-found: error

  package:
    needs: [contract, runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: build/runtime-artifacts
          merge-multiple: true
      - name: Assemble both targets
        run: |
          mkdir -p runtime
          tar -xf build/runtime-artifacts/runtime-darwin-arm64.tar -C runtime
          tar -xf build/runtime-artifacts/runtime-win32-x64.tar -C runtime
      - name: Pack one runnable Lab ZIP
        shell: bash
        run: |
          VERSION=$(node -p "require('./soundbase-plugin.json').version")
          npm run pack:release -- --expect "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: |
            dist/*.zip
            dist/*.sha256
            dist/package-report.json
          if-no-files-found: error

  packaged-target:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: plugin-zip
          path: dist
      - name: Validate and extract the immutable archive
        shell: bash
        run: python scripts/verify-release.py dist/*.zip --extract "build/package with spaces é" --output build/target-package-report.json
      - name: Make the Mac payload read-only
        if: runner.os == 'macOS'
        run: chmod -R a-w "build/package with spaces é/rsa306b"
      - name: Exercise the extracted real worker in mock mode
        run: node scripts/check-package.mjs "build/package with spaces é/rsa306b"
      - uses: actions/upload-artifact@v7
        with:
          name: package-check-${{ matrix.os }}
          path: build/target-package-report.json
