name: Release

# Rehearsal is the default. Publication promotes already-tested bytes; it never
# rebuilds after hardware/generator qualification and never publishes on tag push.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish an already qualified immutable candidate'
        type: boolean
        default: false
      candidate_run_id:
        description: 'Successful CI/rehearsal Actions run ID containing plugin-zip'
        type: string
        default: ''
      prerelease:
        description: 'Mark this release as a beta instead of stable'
        type: boolean
        default: false
      replace_source:
        description: 'Only to replace an existing release: its current 40-character source commit'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  rehearsal:
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/ci.yml

  publish:
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Download the successful candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'A numeric candidate run ID is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > candidate-run.json
          test "$(jq -r .conclusion candidate-run.json)" = success
          gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name plugin-zip --dir dist
      - name: Check artifact, source identity, and all hardware gates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ZIPS=(dist/*.zip)
          test "${#ZIPS[@]}" = 1
          python scripts/verify-release.py "${ZIPS[0]}" --qualification release/qualification.json --output candidate-verified.json
          test "$(jq -r .source_commit candidate-verified.json)" = "$(jq -r .head_sha candidate-run.json)"
          test "$(jq -r .event candidate-run.json)" != pull_request
      - name: Publish the qualified ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPLACE_SOURCE: ${{ inputs.replace_source }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version candidate-verified.json)
          SOURCE=$(jq -r .source_commit candidate-verified.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ ]]
          TAG="v$VERSION"
          TITLE="Tektronix RSA306B $VERSION"
          RELEASE_FLAGS=(--latest --prerelease=false)
          if [[ "$PRERELEASE" = true ]]; then
            TITLE="$TITLE beta"
            RELEASE_FLAGS=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [[ "$REPLACE_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo 'Existing release requires its explicit previous source commit'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > previous-release.json
            test "$(jq -r .immutable previous-release.json)" = false
            OLD_TAG=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
            test "$OLD_TAG" = "$REPLACE_SOURCE"
            # The candidate and qualification gates above also apply to a
            # replacement. A lease prevents moving a tag changed by someone else.
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir previous-assets
            git fetch --no-tags --depth=1 origin "$SOURCE"
            git push --force-with-lease="refs/tags/$TAG:$REPLACE_SOURCE" origin "$SOURCE:refs/tags/$TAG"
            gh release upload "$TAG" "dist/rsa306b-$VERSION.zip" "dist/rsa306b-$VERSION.zip.sha256" \
              release/qualification.json release/reports/*.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "${RELEASE_FLAGS[@]}" \
              --target "$SOURCE" --title "$TITLE" --notes-file release/NOTES.md
            exit 0
          fi
          test -z "$REPLACE_SOURCE"
          # --target does not move an existing tag. Refuse one rather than
          # accidentally associating qualified bytes with a different commit.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag $TAG already exists; use an unreleased version"
            exit 1
          else
            test "$?" = 2
          fi
          gh release create "$TAG" "dist/rsa306b-$VERSION.zip" "dist/rsa306b-$VERSION.zip.sha256" \
            release/qualification.json release/reports/*.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE" \
            "${RELEASE_FLAGS[@]}" --title "$TITLE" --notes-file release/NOTES.md
      - name: Preserve the previous release when replacing it
        if: ${{ always() && inputs.replace_source != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: previous-release
          path: |
            previous-release.json
            previous-assets/*
          if-no-files-found: ignore
